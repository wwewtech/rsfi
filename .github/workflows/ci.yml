name: CI RSFI Mathematical Benchmarks & Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests (geometry, whitening, filters)
        run: pytest tests/test_geometry.py tests/test_whitening.py tests/test_filter.py -v

      - name: Run advanced mathematical stress tests
        run: pytest tests/test_math_advanced.py -v
